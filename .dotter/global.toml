# Run from the repo root: `dotter deploy`. Each machine picks its packages in
# .dotter/local.toml (or .dotter/<hostname>.toml), untracked:
#   packages = ["hyprland", "starship"]   # hyprland pulls in zsh and nvim too
# After every deploy, post_deploy.sh copies configs/sh/env.sh's block (what
# every shell exports) into each shell's rc: bash, zsh, fish and nushell.

# Link everything, never template. In automatic mode dotter renders any file
# containing "{{" as its own template and copies the result; the rice-theme
# templates are full of Noctalia's {{ colors.* }} tokens, so nvim, kitty,
# ghostty, foot and GTK would lose their generated colours.
[settings]
default_target_type = "symbolic"

# The desktop: CachyOS's Hyprland and Noctalia configs with this repo's changes,
# and rice-theme (colour locks).
[hyprland]
depends = ["zsh", "nvim"]

# One link per directory, as for nvim below: an edit in ~/.config is an edit
# here, and both reload at once. What Noctalia and rice-theme generate in them
# (hypr/noctalia.lua, noctalia/templates.toml) stays untracked.
[hyprland.files]
"configs/hypr" = { target = "~/.config/hypr", type = "symbolic", recurse = false }
"configs/noctalia" = { target = "~/.config/noctalia", type = "symbolic", recurse = false }
# rice-theme, linked into ~/.rices instead of copied by
# hyprland-multishell/install.sh: a git pull updates it in place.
"hyprland-multishell/bin" = "~/.rices/bin"
"hyprland-multishell/lib" = "~/.rices/lib"
"hyprland-multishell/tools.d" = "~/.rices/tools.d"
"hyprland-multishell/templates" = "~/.rices/templates"

[zsh.files]
"configs/zsh/zsh.rc" = "~/.zshrc"
"configs/zsh/p10k.zsh" = "~/.p10k.zsh"

# One link for the whole directory, not one per file: files created under
# ~/.config/nvim and vim.pack's lockfile writes land in the repo.
[nvim.files]
"configs/nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }

# Starship. ~/.bashrc sources the bash half
# (hyprland-multishell/bootstrap-packages.sh adds the line).
[starship.files]
"configs/starship/starship.toml" = "~/.config/starship.toml"
"configs/starship/starship.bash" = "~/.config/starship/starship.bash"
