version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'diamond'
    powerline_symbol = ''
    foreground_templates = ["{{if gt .Code 0}}black{{else}}white{{end}}"]
    background = '#ff479c'
    leading_diamond = ''
    trailing_diamond = ''
    template = '   {{ .Path }} '

    [blocks.segments.properties]
      folder_separator_icon = '  '
      home_icon = '~'
      style = 'folder'

  [[blocks.segments]]
    type = 'git'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#193549'
    background = '#fffb38'
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}#FF9248{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}', '{{ if or (gt .Ahead 0) (gt .Behind 0) }}#B388FF{{ end }}']
    template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '

    [blocks.segments.properties]
      branch_max_length = 25.0
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    type = 'node'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#ffffff'
    background = '#6CA35E'
    template = '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '

    [blocks.segments.properties]
      fetch_version = true

  [[blocks.segments]]
    type = 'go'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#111111'
    background = '#8ED1F7'
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '

    [blocks.segments.properties]
      fetch_version = true

  [[blocks.segments]]
    type = 'julia'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#111111'
    background = '#4063D8'
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '

    [blocks.segments.properties]
      fetch_version = true

  [[blocks.segments]]
    type = 'python'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#111111'
    background = '#FFDE57'
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ if .Venv }} ({{ .Venv }}){{ end }}{{ end }} '

    [blocks.segments.properties]
      display_mode = 'context'
      fetch_virtual_env = true
      home_enabled = true

  [[blocks.segments]]
    type = 'ruby'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#ffffff'
    background = '#AE1401'
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_version = true

  [[blocks.segments]]
    type = 'azfunc'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#ffffff'
    background = '#FEAC19'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_version = false

  [[blocks.segments]]
    type = 'aws'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#ffffff'
    background_templates = ['{{if contains "default" .Profile}}#FFA400{{end}}', '{{if contains "jan" .Profile}}#f1184c{{end}}']
    template = '  {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '

    [blocks.segments.properties]
      display_default = false

  [[blocks.segments]]
    type = 'root'
    style = 'powerline'
    powerline_symbol = ''
    foreground = '#111111'
    background = '#ffff66'
    template = '  '

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = '#ffffff'
    background = '#83769c'
    template = '<transparent></>  {{ .FormattedMs }}⠀'

    [blocks.segments.properties]
      always_enabled = true

  [[blocks.segments]]
    type = 'status'
    style = 'diamond'
    foreground = '#ffffff'
    background = '#00897b'
    background_templates = ['{{ if gt .Code 0 }}#e91e63{{ end }}']
    trailing_diamond = ''
    template = '<parentBackground></>  '

    [blocks.segments.properties]
      always_enabled = true

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    type = 'shell'
    style = 'plain'
    foreground = '#ffffff'
    background = '#0077c2'
    template = '<#0077c2,transparent></>  {{ .Name }} <transparent,#0077c2></>'

  [[blocks.segments]]
    type = 'ytm'
    style = 'powerline'
    powerline_symbol = ''
    invert_powerline = true
    foreground = '#111111'
    background = '#1BD760'
    template = '  {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '

    [blocks.segments.properties]
      paused_icon = ' '
      playing_icon = ' '

  [[blocks.segments]]
    type = 'battery'
    style = 'powerline'
    powerline_symbol = ''
    invert_powerline = true
    foreground = '#ffffff'
    background = '#f36943'
    background_templates = ['{{if eq "Charging" .State.String}}#40c4ff{{end}}', '{{if eq "Discharging" .State.String}}#ff5722{{end}}', '{{if eq "Full" .State.String}}#4caf50{{end}}']
    template = ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '

    [blocks.segments.properties]
      charged_icon = ' '
      charging_icon = ' '
      discharging_icon = ' '

  [[blocks.segments]]
    type = 'time'
    style = 'diamond'
    foreground = '#111111'
    background = '#2e9599'
    leading_diamond = ''
    trailing_diamond = ''
    template = ' {{ .CurrentDate | date .Format }} '

[transient_prompt]
  leading_diamond = ''
  trailing_diamond = ''
  foreground_templates = ["{{if gt .Code 0}}black{{else}}white{{end}}"]
  background = '#ff479c'
  template = '>_<'

[secondary_prompt]
  foreground = 'magenta'
  background = 'transparent'
  template = '>>'