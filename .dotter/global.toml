# Run from the repo root: `dotter deploy`. Each machine picks its packages in
# .dotter/local.toml (or .dotter/<hostname>.toml), untracked:
#   packages = ["hyprland"]

# Link everything, never template. In automatic mode dotter renders any file
# containing "{{" as its own template and copies the result; the rice-theme
# templates are full of Noctalia's {{ colors.* }} tokens, so nvim, kitty,
# ghostty, foot and GTK would lose their generated colours.
[settings]
default_target_type = "symbolic"

# hyprland-multishell's tools, linked into ~/.rices instead of copied by
# install.sh: a git pull updates them in place. Run hyprland-multishell/install.sh
# once after the first deploy for the greeter stub (root); it leaves these links alone.
# Profiles and owned.txt are yours, not dotter's.
[hyprland.files]
"hyprland-multishell/bin" = "~/.rices/bin"
"hyprland-multishell/lib" = "~/.rices/lib"
"hyprland-multishell/tools.d" = "~/.rices/tools.d"
"hyprland-multishell/templates" = "~/.rices/templates"
"hyprland-multishell/owned.default.txt" = "~/.rices/owned.default.txt"
